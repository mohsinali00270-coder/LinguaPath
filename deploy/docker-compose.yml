# Local or single-server production stack (docs/OPERATIONS.md).
#   cp deploy/.env.example deploy/.env   # then fill in the secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Put a TLS reverse proxy (nginx, Caddy, IIS ARR, Azure Front Door) in front of api and admin.
name: linguapath

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - sql-data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?set SEQ_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5341:80"   # log viewer, local only; tunnel to it over SSH
    volumes:
      - seq-data:/data
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    depends_on:
      sql: { condition: service_healthy }
      redis: { condition: service_started }
    environment: &common
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Server=sql;Database=LinguaPath;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
      App__PublicBaseUrl: ${API_PUBLIC_URL}
      Seed__SuperAdminEmail: ${SUPER_ADMIN_EMAIL}
      Seed__SuperAdminPassword: ${SUPER_ADMIN_PASSWORD}
      Email__Mode: Smtp
      Email__Host: ${SMTP_HOST}
      Email__UserName: ${SMTP_USER}
      Email__Password: ${SMTP_PASSWORD}
      Redis__ConnectionString: redis:6379
      Serilog__WriteTo__0__Name: Seq
      Serilog__WriteTo__0__Args__serverUrl: http://seq:80
      Ai__Providers__DeepSeek__ApiKey: ${DEEPSEEK_API_KEY}
      LanguageServices__Translator__ApiKey: ${AZURE_TRANSLATOR_KEY}
      LanguageServices__Translator__Region: ${AZURE_REGION}
      LanguageServices__Speech__ApiKey: ${AZURE_SPEECH_KEY}
      LanguageServices__Speech__Region: ${AZURE_REGION}
      Push__FcmProjectId: ${FCM_PROJECT_ID}
      Push__FcmServiceAccount: /run/secrets/fcm.json
    secrets:
      - source: fcm
        target: fcm.json
    volumes:
      - uploads:/data
      - api-logs:/app/logs
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin
    depends_on:
      sql: { condition: service_healthy }
    environment:
      <<: *common
      App__PublicBaseUrl: ${API_PUBLIC_URL}
      # Only the API seeds and migrates; the admin waits for it.
      Database__SkipInitialization: "true"
    volumes:
      - uploads:/data
      - admin-logs:/app/logs
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

secrets:
  fcm:
    file: ./secrets/fcm.json

volumes:
  sql-data:
  seq-data:
  uploads:
  api-logs:
  admin-logs:
